<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>漫步上三川 - 日本小镇探索</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-wrapper">

  <!-- ===== 上部HUD ===== -->
  <header id="hud">

    <div class="title-area">
      <div class="small-title">日本・栃木县</div>
      <div class="game-title">漫步上三川</div>
    </div>

    <div class="area-area">
      <span class="hud-label">当前位置</span>
      <span id="areaName">上三川通り</span>
    </div>

    <div class="collection-area">
      <span class="hud-label">日本语图鉴</span>
      <span id="collectionCount">0 / 100</span>
    </div>

    <button id="libraryButton">
      📖 日本语图鉴
    </button>

  </header>


  <!-- ===== ゲーム画面 ===== -->
  <main id="game-container">

    <canvas
      id="gameCanvas"
      width="1280"
      height="720">
    </canvas>


    <!-- 操作説明 -->
    <div id="controls">

      <div>
        <kbd>WASD</kbd>
        <span>移动</span>
      </div>

      <div>
        <kbd>E</kbd>
        <span>对话 / 调查</span>
      </div>

      <div>
        <kbd>L</kbd>
        <span>日本语图鉴</span>
      </div>

    </div>


    <!-- インタラクション表示 -->
    <div id="interactionPrompt" class="hidden">
      E　调查
    </div>


    <!-- 会話ウィンドウ -->
    <div id="dialogueBox" class="hidden">

      <div id="speakerName"></div>

      <div id="dialogueJapanese"></div>

      <div id="dialogueChinese"></div>

      <div class="dialogue-next">
        E / Enter　继续
      </div>

    </div>


    <!-- エリア名表示 -->
    <div id="areaSplash" class="hidden">

      <div id="areaSplashJapanese"></div>
      <div id="areaSplashChinese"></div>

    </div>

  </main>

</div>


<!-- ===== 日本語カード取得 ===== -->

<div id="cardPopup" class="hidden">

  <div class="card">

    <div class="card-new">
      NEW JAPANESE WORD
    </div>

    <div id="cardJapanese"></div>

    <div id="cardReading"></div>

    <div id="cardChinese"></div>

    <div id="cardExample"></div>

    <button id="cardClose">
      收藏到图鉴
    </button>

  </div>

</div>


<!-- ===== ライブラリ ===== -->

<div id="libraryOverlay" class="hidden">

  <div id="libraryPanel">

    <div class="library-header">

      <div>
        <h2>日本语图鉴</h2>
        <p>
          在上三川散步，与居民交流，收集100个日本语词汇。
        </p>
      </div>

      <button id="libraryClose">
        ×
      </button>

    </div>


    <div class="library-progress">

      <div id="libraryProgressText">
        0 / 100
      </div>

      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>

    </div>


    <div id="libraryGrid"></div>

  </div>

</div>


<!-- ===== エリア移動 ===== -->

<div id="travelOverlay" class="hidden">

  <div class="travel-box">

    <div class="travel-small">
      WALKING TO
    </div>

    <div id="travelDestination">
      上三川城址公園
    </div>

  </div>

</div>


<script src="data.js"></script>
<script src="game.js"></script>

</body>
</html>
